{%- component smugmug(path: string, thumbnail: string, caption: string = "", width: string = "", height: string = "", alt: string = "Gallery preview") -%}
<figure class="gallery-figure">
<a href="https://gallery.aendu.rocks/{{ path | safe }}" target="_blank" rel="noopener">
<img src="{{ thumbnail | safe }}" alt="{{ alt }}" {% if width %}width="{{ width }}"{% endif %} {% if height %}height="{{ height }}"{% endif %} />
</a>
{%- if caption %}
<figcaption>{{ caption | safe }}</figcaption>
{%- endif %}
</figure>
{%- endcomponent smugmug -%}
